version: '3.8'

services:

  db:
    image: postgres:16
    restart: always
    shm_size: 128mb
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  worker:
    build: .
    restart: always
    env_file:
      - .env
    command: celery -A celery_app worker --loglevel=info
    depends_on:
      - db
      - redis

  redis:
    image: redis:8
    container_name: redis
    ports:
      - "6379:6379" # Redis server port
    
  flower:
    image: mher/flower:2.1.0
    restart: always
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis

volumes:
  pgdata: